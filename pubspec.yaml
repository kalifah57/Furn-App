name: furn_app
description: "تطبيق تأثيث ذكي عربي-أولًا — MVP (mock-first)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management + DI (ADR-0001 §2, §4)
  flutter_riverpod: ^2.5.1
  # Routing (ADR-0001 §3)
  go_router: ^14.2.0
  # القيم/المقارنة للنماذج الثابتة
  equatable: ^2.0.5
  # معرّفات المشاريع
  uuid: ^4.4.0
  # تنسيق الأرقام/العملة العربية
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/catalog.json
  # لإضافة خط عربي لاحقًا (Cairo/Tajawal) ضع الملفات في assets/fonts وفعّل الكتلة:
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
